<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="attendee" data-page="dashboard"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script>
const v = App.shell('attendee', 'dashboard'); if (v) {
  const u = App.user(), today = new Date().toISOString().slice(0, 10);
  const mine = Store.reservations().filter(r => r.user_ID === u.user_ID).map(Store.resView);
  const active = mine.filter(r => r.reservation_status !== 'cancelled');
  const tickets = active.reduce((n, r) => n + r.quantity, 0);
  const evs = Store.events().filter(e => e.event_date >= today);
  const nextRes = active.filter(r => r.event.event_date >= today).sort((a, b) => a.event.event_date.localeCompare(b.event.event_date))[0];
  v.innerHTML = `<div class="page-head"><div><h1>Hello, ${App.esc(u.full_Name.split(' ')[0])}</h1><div class="text-muted-2">Here is what is happening with your tickets.</div></div>
      <a class="btn btn-brand" href="events.html"><i class="bi bi-search me-1"></i>Browse events</a></div>
    <div class="row g-3 mb-4">
      ${[['Tickets reserved', tickets, 'ticket-perforated'], ['Active events available', evs.length, 'calendar-check'], ['Upcoming reservations', active.filter(r => r.event.event_date >= today).length, 'hourglass-split']].map(([l, n, i]) => `<div class="col-md-4"><div class="card stat d-flex flex-row justify-content-between align-items-center"><div><div class="label">${l}</div><div class="value">${n}</div></div><div class="ico"><i class="bi bi-${i}"></i></div></div></div>`).join('')}
    </div>
    <div class="row g-4"><div class="col-lg-7"><div class="card p-3"><h2 class="h5">Next up</h2>
      ${nextRes ? `<div class="d-flex flex-wrap justify-content-between gap-3 align-items-center"><div><div class="fw-semibold">${App.esc(nextRes.event.event_name)}</div>
        <div class="event-meta">${App.fmtDate(nextRes.event.event_date)} · ${App.fmtTime(nextRes.event.event_time)} · ${App.esc(nextRes.event.venue)}</div>
        <div class="mt-2">${App.pill(nextRes.reservation_status)} <span class="small ms-2">${nextRes.code} · ${nextRes.quantity} × ${App.esc(nextRes.ticket.type_name)}</span></div></div>
        ${nextRes.reservation_status === 'confirmed' ? `<a class="btn btn-accent" href="ticket.html?id=${nextRes.reservation_ID}"><i class="bi bi-qr-code me-1"></i>View e-ticket</a>` : `<span class="small text-muted-2">E-ticket is issued once an Administrator confirms.</span>`}</div>`
      : `<p class="text-muted-2 mb-0">No upcoming reservations yet. Find an event and reserve your seats.</p>`}</div></div>
      <div class="col-lg-5"><div class="card p-3"><h2 class="h5">Open for reservation</h2><ul class="list-unstyled mb-0">
      ${evs.slice(0, 4).map(e => { const s = Store.seats(e.event_ID); return `<li class="d-flex justify-content-between py-2 border-bottom"><div><div class="fw-semibold">${App.esc(e.event_name)}</div><div class="small text-muted-2">${App.fmtDate(e.event_date)}</div></div><div class="text-end"><div class="small">${s.left} left</div><a class="small" href="reserve.html?event=${e.event_ID}">Reserve</a></div></li>`; }).join('')}</ul></div></div></div>`;
  App.showFlash();
}
</script></body></html>
