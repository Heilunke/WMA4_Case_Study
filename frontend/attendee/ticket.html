<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Ticket · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="attendee" data-page="reservations"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script type="module">
const v = await App.shell('attendee', 'reservations'); if (v) {
  const u = App.user(), raw = Store.resById(App.param('id'));
  if (!raw || raw.user_ID !== u.user_ID) v.innerHTML = '<div class="alert alert-warning">Reservation not found. <a href="my-reservations.html">Back</a></div>';
  else {
    const r = Store.resView(raw), ok = r.reservation_status === 'confirmed';
    v.innerHTML = `<div class="page-head"><div><a class="small text-decoration-none" href="my-reservations.html"><i class="bi bi-arrow-left"></i> My reservations</a><h1 class="mt-1">E-tickets · ${r.code}</h1></div>
      ${ok ? '<button class="btn btn-brand" onclick="print()"><i class="bi bi-printer me-1"></i>Print / save as PDF</button>' : ''}</div>
      ${ok ? '<p class="text-muted-2">Show the QR code (or the ticket code) at the entrance. Each attendee has their own ticket and can only be admitted once.</p>'
        : `<div class="alert alert-warning">This reservation is <strong>${r.reservation_status}</strong>. E-tickets are issued only after an Administrator confirms the reservation.</div>`}
      ${ok ? r.attendees.map((a, i) => `<div class="eticket ${a.status ? '' : ''}"><div class="stub"><div class="qr">${App.qr(a.ticket_code)}</div><div class="code">${a.ticket_code}</div>${a.status ? App.pill('checked').replace('Checked', 'Checked in') : App.pill('valid')}</div>
        <div class="body"><div class="small text-uppercase text-muted-2 fw-semibold">Admit one · ${App.esc(r.ticket.type_name)}</div><h2 class="h4 mt-1">${App.esc(r.event.event_name)}</h2>
        <dl class="kv mt-3 mb-0"><dt>Attendee</dt><dd class="mb-0 fw-semibold">${App.esc(a.full_name)}</dd><dt>Date</dt><dd class="mb-0">${App.fmtDate(r.event.event_date)}</dd><dt>Time</dt><dd class="mb-0">${App.fmtTime(r.event.event_time)}</dd><dt>Venue</dt><dd class="mb-0">${App.esc(r.event.venue)}</dd><dt>Reservation</dt><dd class="mb-0">${r.code} · ticket ${i + 1} of ${r.quantity}</dd></dl><div class="barcode" aria-hidden="true"></div></div></div>`).join('') : ''}`;
  }
}
</script></body></html>
