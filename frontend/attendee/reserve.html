<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserve a Ticket · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="attendee" data-page="reserve"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script type="module">
const v = await App.shell('attendee', 'events'); if (v) {
  const ev = Store.eventById(App.param('event'));
  const head = `<div class="page-head"><div><a href="events.html" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> All events</a><h1 class="mt-1">Reserve a ticket</h1></div></div>`;
  const held = ev ? App.heldFor(ev.event_ID) : null;
  if (!ev) { v.innerHTML = '<div class="alert alert-warning">Event not found. <a href="events.html">Back to events</a></div>'; }
  else if (held) {
    // Rule: one ticket per account for each event.
    v.innerHTML = head + `<div class="alert alert-info" role="status">You already hold a ticket for <strong>${App.esc(ev.event_name)}</strong> (${Store.resCode(held)}, ${App.esc(held.reservation_status)}). Each account can reserve one ticket per event. <a href="my-reservations.html">View my reservations</a>. If that reservation is cancelled, you can reserve this event again.</div>`;
  }
  else {
    const u = App.user(), types = Store.typesOf(ev.event_ID);
    const first = types.find(t => t.quantity_available > 0);
    v.innerHTML = head + `
    <div id="err" class="alert alert-danger d-none" role="alert"></div>
    <form id="form" class="row g-4" novalidate>
      <div class="col-lg-8">
        <div class="card p-3 mb-3"><h2 class="h5 mb-1">${App.esc(ev.event_name)}</h2>
          <div class="event-meta"><span class="me-3"><i class="bi bi-calendar3"></i>${App.fmtDate(ev.event_date)} · ${App.fmtTime(ev.event_time)}</span><span><i class="bi bi-geo-alt"></i>${App.esc(ev.venue)}</span></div>
          <p class="mb-0 mt-2 small">${App.esc(ev.description)}</p></div>
        <div class="card p-3 mb-3"><h2 class="h6 text-uppercase text-muted-2">1 · Ticket type</h2>
          <div class="row g-2">${types.map(t => `<div class="col-md-6"><label class="type-option ${t.quantity_available ? '' : 'disabled'}"><div class="d-flex align-items-start gap-2">
            <input class="form-check-input mt-1" type="radio" name="type" value="${t.ticket_ID}" ${t === first ? 'checked' : ''} ${t.quantity_available ? '' : 'disabled'}>
            <div class="flex-grow-1"><div class="d-flex justify-content-between"><strong>${App.esc(t.type_name)}</strong><strong>${App.peso(t.price)}</strong></div>
            <div class="small text-muted-2">${t.quantity_available ? t.quantity_available + ' left' : 'Sold out'}</div></div></div></label></div>`).join('')}</div>
          <div class="small text-muted-2 mt-2">${types.length === 1 ? 'This event offers a single ticket type. ' : ''}Each account can reserve one ticket per event.</div></div>
        <div class="card p-3 mb-3"><h2 class="h6 text-uppercase text-muted-2">2 · Attendee details</h2>
          <div class="attendee-row"><div class="row g-2">
            <div class="col-md-7"><label class="form-label small mb-1" for="an">Full name</label><input id="an" class="form-control" required value="${App.esc(u.full_Name)}"></div>
            <div class="col-md-5"><label class="form-label small mb-1" for="ac">Contact number</label><input id="ac" class="form-control" inputmode="tel" placeholder="09XX XXX XXXX"></div></div></div></div>
        <div class="card p-3"><h2 class="h6 text-uppercase text-muted-2">3 · Payment</h2>
          <p class="small mb-0">Payment is made in cash at the venue. There is no online payment in this system. An Administrator records your payment and confirms the reservation.</p>
          <input type="hidden" id="method" value="Cash"></div>
      </div>
      <div class="col-lg-4"><div class="card p-3 sticky-summary"><h2 class="h5">Summary</h2>
        <dl class="mb-3 small" id="sum"></dl>
        <div class="d-flex justify-content-between align-items-baseline border-top pt-3"><span>Total</span><span class="fs-4 fw-bold" id="total"></span></div>
        <button class="btn btn-brand w-100 py-2 mt-3" ${first ? '' : 'disabled'}>Submit reservation</button>
        <div class="small text-muted-2 mt-3"><i class="bi bi-info-circle"></i> Your seat is held as <strong>Pending</strong> until an Administrator confirms. Once confirmed, your e-ticket (QR code) appears in My Reservations. Cancelling releases the seat.${Store.holdHours() ? ` <strong>Unpaid reservations are cancelled automatically after ${Store.holdHours()} hours</strong>, so pay at the venue office or send your transfer reference before then.` : ''}</div></div></div>
    </form>`;
    const $ = id => document.getElementById(id);
    const sel = () => Store.typeById(document.querySelector('[name=type]:checked')?.value);
    const draw = () => {
      const t = sel(); if (!t) return;
      $('sum').innerHTML = `<dt>Event</dt><dd>${App.esc(ev.event_name)}</dd><dt>Ticket</dt><dd class="mb-0">${App.esc(t.type_name)} @ ${App.peso(t.price)}</dd>`;
      $('total').textContent = App.peso(t.price);
    };
    document.querySelectorAll('[name=type]').forEach(r => r.onchange = draw);
    draw();
    $('form').onsubmit = async e => {
      e.preventDefault();
      const btn = $('form').querySelector('button:not([type=button])'); btn.disabled = true;
      try {
        const attendees = [{ full_name: $('an').value, contact_number: $('ac').value }];
        const r = await Store.reserve(sel().ticket_ID, 1, attendees, $('method').value);
        App.flash(`Reservation ${Store.resCode(r)} submitted — status: Pending.`); location.href = 'my-reservations.html';
      } catch (er) {
        btn.disabled = false; $('err').textContent = er.message; $('err').classList.remove('d-none'); window.scrollTo({ top: 0, behavior: 'smooth' });
        if (er.code === 'sold_out' || er.code === 'already_reserved') setTimeout(() => location.reload(), 2500); // data changed: show fresh state
      }
    };
  }
}
</script></body></html>
