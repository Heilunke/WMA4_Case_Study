<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserve Tickets · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="attendee" data-page="reserve"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script>
const v = App.shell('attendee', 'events'); if (v) {
  const ev = Store.eventById(App.param('event'));
  if (!ev) { v.innerHTML = '<div class="alert alert-warning">Event not found. <a href="events.html">Back to events</a></div>'; }
  else {
    const u = App.user(), types = Store.typesOf(ev.event_ID);
    const first = types.find(t => t.quantity_available > 0);
    v.innerHTML = `<div class="page-head"><div><a href="events.html" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> All events</a><h1 class="mt-1">Reserve tickets</h1></div></div>
    <div id="err" class="alert alert-danger d-none" role="alert"></div>
    <form id="form" class="row g-4" novalidate>
      <div class="col-lg-8">
        <div class="card p-3 mb-3"><h2 class="h5 mb-1">${App.esc(ev.event_name)}</h2>
          <div class="event-meta"><span class="me-3"><i class="bi bi-calendar3"></i>${App.fmtDate(ev.event_date)} · ${App.fmtTime(ev.event_time)}</span><span><i class="bi bi-geo-alt"></i>${App.esc(ev.venue)}</span></div>
          <p class="mb-0 mt-2 small">${App.esc(ev.description)}</p></div>
        <div class="card p-3 mb-3"><h2 class="h6 text-uppercase text-muted-2">1 · Ticket type</h2>
          <div class="row g-2">${types.map(t => `<div class="col-md-6"><label class="type-option ${t.quantity_available ? '' : 'disabled'}"><div class="d-flex align-items-start gap-2">
            <input class="form-check-input mt-1" type="radio" name="type" value="${t.ticket_ID}" ${t === first ? 'checked' : ''} ${t.quantity_available ? '' : 'disabled'}>
            <div class="flex-grow-1"><div class="d-flex justify-content-between"><strong>${App.esc(t.type_name)}</strong><strong>${App.peso(t.price)}</strong></div>
            <div class="small text-muted-2">${t.quantity_available ? t.quantity_available + ' left' : 'Sold out'}</div></div></div></label></div>`).join('')}</div>
          ${types.length === 1 ? '<div class="small text-muted-2 mt-2">This event offers a single ticket type.</div>' : ''}</div>
        <div class="card p-3 mb-3"><h2 class="h6 text-uppercase text-muted-2">2 · Quantity</h2>
          <div class="d-flex align-items-center gap-3"><button type="button" class="btn btn-outline-secondary" id="minus" aria-label="Fewer tickets"><i class="bi bi-dash-lg"></i></button>
          <input id="qty" class="form-control text-center fw-bold" style="max-width:90px" type="number" min="1" max="10" value="1" aria-label="Quantity">
          <button type="button" class="btn btn-outline-secondary" id="plus" aria-label="More tickets"><i class="bi bi-plus-lg"></i></button><span class="small text-muted-2">Up to 10 per reservation</span></div></div>
        <div class="card p-3 mb-3"><h2 class="h6 text-uppercase text-muted-2">3 · Attendee details <span class="fw-normal text-lowercase">— one per ticket</span></h2>
          <div id="attendees" class="d-grid gap-2"></div></div>
        <div class="card p-3"><h2 class="h6 text-uppercase text-muted-2">4 · Payment</h2>
          <p class="small mb-2">No online payment is processed in this system. Choose how you will pay; an Administrator records your payment and confirms the reservation.</p>
          <select id="method" class="form-select" style="max-width:320px" aria-label="Payment method"><option>Pay at venue (cash)</option><option>Bank / e-wallet transfer (reference sent to organizer)</option></select></div>
      </div>
      <div class="col-lg-4"><div class="card p-3 sticky-summary"><h2 class="h5">Summary</h2>
        <dl class="mb-3 small" id="sum"></dl>
        <div class="d-flex justify-content-between align-items-baseline border-top pt-3"><span>Total</span><span class="fs-4 fw-bold" id="total"></span></div>
        <button class="btn btn-brand w-100 py-2 mt-3" ${first ? '' : 'disabled'}>Submit reservation</button>
        <div class="small text-muted-2 mt-3"><i class="bi bi-info-circle"></i> Your seats are held as <strong>Pending</strong> until an Administrator confirms. Once confirmed, your e-ticket (QR code) appears in My Reservations. Cancelling releases the seats.</div></div></div>
    </form>`;
    const $ = id => document.getElementById(id), qty = $('qty');
    const sel = () => Store.typeById(document.querySelector('[name=type]:checked')?.value);
    const old = {};
    const drawAttendees = () => {
      const t = sel(); if (!t) return;
      let n = Math.max(1, Math.min(10, +qty.value || 1, t.quantity_available)); qty.value = n; qty.max = Math.min(10, t.quantity_available);
      document.querySelectorAll('#attendees .attendee-row').forEach((r, i) => { old[i] = [r.querySelector('.an').value, r.querySelector('.ac').value]; });
      $('attendees').innerHTML = Array.from({ length: n }, (_, i) => `<div class="attendee-row"><div class="small fw-semibold mb-2">Ticket ${i + 1}${i === 0 ? ' (you)' : ''}</div><div class="row g-2">
        <div class="col-md-7"><label class="form-label small mb-1" for="an${i}">Full name</label><input id="an${i}" class="form-control an" required value="${App.esc(old[i]?.[0] ?? (i === 0 ? u.full_Name : ''))}"></div>
        <div class="col-md-5"><label class="form-label small mb-1" for="ac${i}">Contact number</label><input id="ac${i}" class="form-control ac" inputmode="tel" placeholder="09XX XXX XXXX" value="${App.esc(old[i]?.[1] ?? '')}"></div></div></div>`).join('');
      $('sum').innerHTML = `<dt>Event</dt><dd>${App.esc(ev.event_name)}</dd><dt>Ticket</dt><dd>${App.esc(t.type_name)} @ ${App.peso(t.price)}</dd><dt>Quantity</dt><dd class="mb-0">${n}</dd>`;
      $('total').textContent = App.peso(t.price * n);
    };
    document.querySelectorAll('[name=type]').forEach(r => r.onchange = drawAttendees);
    qty.oninput = drawAttendees; $('minus').onclick = () => { qty.value = Math.max(1, +qty.value - 1); drawAttendees(); }; $('plus').onclick = () => { qty.value = +qty.value + 1; drawAttendees(); };
    drawAttendees();
    $('form').onsubmit = e => {
      e.preventDefault();
      try {
        const attendees = [...document.querySelectorAll('#attendees .attendee-row')].map(r => ({ full_name: r.querySelector('.an').value, contact_number: r.querySelector('.ac').value }));
        const r = Store.reserve(u.user_ID, sel().ticket_ID, +qty.value, attendees, $('method').value);
        App.flash(`Reservation ${Store.resCode(r)} submitted — status: Pending.`); location.href = 'my-reservations.html';
      } catch (er) { $('err').textContent = er.message; $('err').classList.remove('d-none'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    };
  }
}
</script></body></html>
