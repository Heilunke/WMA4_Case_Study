<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Events · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="attendee" data-page="events"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script>
const v = App.shell('attendee', 'events'); if (v) {
  const evs = Store.events(), cats = [...new Set(evs.map(e => e.category))].sort();
  v.innerHTML = `<div class="page-head"><h1>Browse events</h1></div>
    <div class="card p-3 mb-4"><div class="row g-2 align-items-end">
      <div class="col-lg-4"><label class="form-label small" for="q">Search name or venue</label><input id="q" class="form-control" placeholder="e.g. Tech Summit"></div>
      <div class="col-md-4 col-lg-3"><label class="form-label small" for="cat">Category</label><select id="cat" class="form-select"><option value="">All categories</option>${cats.map(c => `<option>${App.esc(c)}</option>`).join('')}</select></div>
      <div class="col-md-4 col-lg-3"><label class="form-label small" for="from">On or after</label><input id="from" type="date" class="form-control"></div>
      <div class="col-md-4 col-lg-2"><button id="clear" class="btn btn-outline-secondary w-100">Clear</button></div></div></div>
    <div class="row g-4" id="grid"></div>`;
  const draw = () => {
    const q = qEl.value.toLowerCase(), c = catEl.value, f = fromEl.value;
    const list = evs.filter(e => (!q || (e.event_name + ' ' + e.venue).toLowerCase().includes(q)) && (!c || e.category === c) && (!f || e.event_date >= f));
    grid.innerHTML = list.length ? list.map(e => App.eventCard(e, `reserve.html?event=${e.event_ID}`)).join('') : '<div class="col-12"><div class="card p-4 text-center text-muted-2">No events match your filters.</div></div>';
  };
  const qEl = document.getElementById('q'), catEl = document.getElementById('cat'), fromEl = document.getElementById('from'), grid = document.getElementById('grid');
  [qEl, catEl, fromEl].forEach(el => el.addEventListener('input', draw));
  document.getElementById('clear').onclick = () => { qEl.value = ''; catEl.value = ''; fromEl.value = ''; draw(); };
  draw();
}
</script></body></html>
