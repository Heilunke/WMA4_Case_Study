<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservations · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="admin" data-page="reservations"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script type="module">
const v = await App.shell('admin', 'reservations'); if (v) {
  let filter = 'all', q = ''; const $ = id => document.getElementById(id);
  v.innerHTML = `<div class="page-head"><h1>Reservations</h1></div>
    <div class="card p-3"><div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
      <div class="btn-group" id="filters" role="group" aria-label="Filter by status">${['all', 'confirmed', 'pending', 'cancelled'].map(s => `<button type="button" class="btn btn-outline-secondary ${s === 'all' ? 'active' : ''}" data-f="${s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div>
      <input id="q" class="form-control" style="max-width:300px" placeholder="Search code, attendee or event" aria-label="Search"></div>
      <div class="table-wrap"><table class="table table-click table-hover align-middle mb-0"><thead><tr><th>Code</th><th>Booked by</th><th>Event</th><th>Ticket</th><th>Qty</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>
    <div class="modal fade" id="detail" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content" id="body"></div></div></div>`;
  const modal = new bootstrap.Modal($('detail'));
  const all = () => Store.reservations().map(Store.resView);
  const draw = () => {
    const list = all().filter(r => (filter === 'all' || r.reservation_status === filter) && (!q || (r.code + r.user.full_Name + r.event.event_name + r.attendees.map(a => a.full_name).join(' ')).toLowerCase().includes(q)));
    $('rows').innerHTML = list.length ? list.map(r => `<tr tabindex="0" data-id="${r.reservation_ID}"><td class="fw-semibold">${r.code}</td><td>${App.esc(r.user.full_Name)}</td><td>${App.esc(r.event.event_name)}</td><td>${App.esc(r.ticket.type_name)}</td><td>${r.quantity}</td><td>${App.peso(r.total_amount)}</td><td>${App.pill(r.payment.payment_status)}</td><td>${App.pill(r.reservation_status)}</td></tr>`).join('') : '<tr><td colspan="8" class="text-center text-muted-2 py-4">No reservations found.</td></tr>';
    document.querySelectorAll('#rows tr[data-id]').forEach(tr => { tr.onclick = () => open(+tr.dataset.id); tr.onkeydown = e => { if (e.key === 'Enter') open(+tr.dataset.id); }; });
  };
  let working = false; // ignore repeat clicks while a request is in flight
  const act = async (fn, msg, id) => { if (working) return; working = true; try { await fn(); App.toast(msg); draw(); open(id); } catch (e) { App.toast(e.message, 'danger'); } finally { working = false; } };
  const open = id => {
    const r = Store.resView(Store.resById(id)), st = r.reservation_status, pay = r.payment;
    $('body').innerHTML = `<div class="modal-header"><h2 class="modal-title h5">${r.code} · ${App.esc(r.event.event_name)}</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><div class="row g-3 mb-3"><div class="col-md-6"><div class="small text-muted-2">Booked by</div><div class="fw-semibold">${App.esc(r.user.full_Name)}</div><div class="small">${App.esc(r.user.email)}</div></div>
        <div class="col-md-6"><div class="small text-muted-2">Submitted</div><div>${App.fmtDT(r.reservation_date)}</div></div>
        <div class="col-md-6"><div class="small text-muted-2">Tickets</div><div>${r.quantity} × ${App.esc(r.ticket.type_name)} = <strong>${App.peso(r.total_amount)}</strong></div></div>
        <div class="col-md-6"><div class="small text-muted-2">Status</div><div>${App.pill(st)}</div></div></div>
      <h3 class="h6">Attendees &amp; tickets</h3>
      <table class="table table-sm"><thead><tr><th>Name</th><th>Contact</th><th>Ticket code</th><th>Entry</th></tr></thead><tbody>${r.attendees.map(a => `<tr><td>${App.esc(a.full_name)}</td><td>${App.esc(a.contact_number || '—')}</td><td class="font-monospace small">${a.ticket_code || '—'}</td><td>${a.status ? 'Checked in' : '—'}</td></tr>`).join('')}</tbody></table>
      <h3 class="h6 mt-3">Payment record</h3><div class="d-flex flex-wrap align-items-center gap-3">${App.pill(pay.payment_status)}<span class="small">Method: ${App.esc(pay.payment_method)}${pay.payment_date ? ' · recorded ' + App.fmtDT(pay.payment_date) : ''}</span>
        ${pay.payment_status === 'unpaid' && st !== 'cancelled' ? '<button class="btn btn-sm btn-outline-success" id="paidBtn">Mark as paid</button>' : ''}</div></div>
      <div class="modal-footer">${st !== 'cancelled' ? '<button class="btn btn-outline-danger me-auto" id="cancelBtn">Cancel reservation</button>' : ''}${st === 'pending' ? '<button class="btn btn-brand" id="confirmBtn"><i class="bi bi-check2-circle me-1"></i>Confirm &amp; issue e-tickets</button>' : ''}<button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>`;
    const on = (i, f) => { const b = $(i); if (b) b.onclick = f; };
    on('confirmBtn', () => act(() => Store.confirm(id), 'Confirmed — e-tickets issued.', id));
    on('cancelBtn', async () => {
      const yes = await App.confirm({ title: `Cancel ${r.code}?`, message: `The ${r.quantity} seat(s) go back to inventory and any e-tickets are voided. This cannot be undone.`, ok: 'Cancel reservation', cancel: 'Keep reservation', danger: true });
      if (yes) act(() => Store.cancel(id), 'Reservation cancelled; seats released.', id);
    });
    on('paidBtn', async () => {
      const m = await App.choose({ title: 'Record payment', message: `${r.code} · ${App.peso(r.total_amount)} from ${r.user.full_Name}`, label: 'Payment method received', options: ['Cash', 'GCash', 'Maya', 'Bank transfer'], value: 'Cash', ok: 'Mark as paid' });
      if (m) act(() => Store.markPaid(id, m), 'Payment recorded.', id);
    });
    modal.show();
  };
  document.querySelectorAll('#filters button').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b)); draw(); });
  $('q').oninput = e => { q = e.target.value.toLowerCase(); draw(); };
  draw(); if (App.param('open')) open(+App.param('open'));
}
</script></body></html>
