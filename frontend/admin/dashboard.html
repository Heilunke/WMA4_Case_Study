<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="admin" data-page="dashboard"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script>
const v = App.shell('admin', 'dashboard'); if (v) {
  const r = Store.report(), t = r.totals;
  const recent = Store.events().slice().sort((a, b) => b.event_ID - a.event_ID).slice(0, 5);
  const pend = Store.reservations().map(Store.resView).filter(x => x.reservation_status === 'pending').slice(0, 5);
  v.innerHTML = `<div class="page-head"><div><h1>Admin dashboard</h1><div class="text-muted-2">Overview of events, reservations and users.</div></div><a class="btn btn-brand" href="events.html?new=1"><i class="bi bi-plus-lg me-1"></i>Create event</a></div>
    <div class="row g-3 mb-4">${[['Total events', t.events, 'calendar-event'], ['Total reservations', t.reservations, 'ticket-perforated'], ['Registered users', t.users, 'people'], ['Pending to confirm', t.pending, 'hourglass-split']].map(([l, n, i]) => `<div class="col-sm-6 col-xl-3"><div class="card stat d-flex flex-row justify-content-between align-items-center"><div><div class="label">${l}</div><div class="value">${n}</div></div><div class="ico"><i class="bi bi-${i}"></i></div></div></div>`).join('')}</div>
    <div class="row g-4"><div class="col-lg-6"><div class="card p-3"><div class="d-flex justify-content-between"><h2 class="h5">Recently created events</h2><a class="small" href="events.html">View all</a></div><ul class="list-unstyled mb-0">
      ${recent.map(e => { const s = Store.seats(e.event_ID); return `<li class="d-flex justify-content-between align-items-center py-2 border-bottom"><div><div class="fw-semibold">${App.esc(e.event_name)}</div><div class="small text-muted-2">${App.fmtDate(e.event_date)} · ${s.sold}/${s.total} reserved</div></div><a class="btn btn-sm btn-outline-secondary" href="events.html?edit=${e.event_ID}">Edit</a></li>`; }).join('')}</ul></div></div>
      <div class="col-lg-6"><div class="card p-3"><div class="d-flex justify-content-between"><h2 class="h5">Awaiting confirmation</h2><a class="small" href="reservations.html">Open reservations</a></div>
      ${pend.length ? `<ul class="list-unstyled mb-0">${pend.map(p => `<li class="d-flex justify-content-between align-items-center py-2 border-bottom"><div><div class="fw-semibold">${p.code} · ${App.esc(p.user.full_Name)}</div><div class="small text-muted-2">${App.esc(p.event.event_name)} · ${p.quantity} ticket(s)</div></div><a class="btn btn-sm btn-brand" href="reservations.html?open=${p.reservation_ID}">Review</a></li>`).join('')}</ul>` : '<p class="text-muted-2 mb-0">Nothing pending. 🎉</p>'}</div></div></div>`;
}
</script></body></html>
