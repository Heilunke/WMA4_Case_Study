<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="admin" data-page="users"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script>
const v = App.shell('admin', 'users'); if (v) {
  const me = App.user();
  v.innerHTML = `<div class="page-head"><div><h1>Users</h1><div class="text-muted-2">Public sign-up creates Attendees only. Promote a trusted user to Administrator here.</div></div></div>
    <div class="card p-3"><div class="table-wrap"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Reservations</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
  const draw = () => {
    document.getElementById('rows').innerHTML = Store.users().map(u => `<tr><td class="fw-semibold">${App.esc(u.full_Name)}${u.user_ID === me.user_ID ? ' <span class="badge text-bg-light">You</span>' : ''}</td><td>${App.esc(u.email)}</td>
      <td><select class="form-select form-select-sm" style="max-width:160px" data-uid="${u.user_ID}" aria-label="Role for ${App.esc(u.full_Name)}" ${u.user_ID === me.user_ID ? 'disabled' : ''}><option value="attendee" ${u.role === 'attendee' ? 'selected' : ''}>Attendee</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Administrator</option></select></td>
      <td>${App.fmtDT(u.created_at)}</td><td>${Store.db().reservations.filter(r => r.user_ID === u.user_ID).length}</td></tr>`).join('');
    document.querySelectorAll("[data-uid]").forEach(s => s.onchange = () => { try { Store.setRole(s.dataset.uid, s.value); App.toast('Role updated.'); } catch (e) { App.toast(e.message, 'danger'); draw(); } });
  };
  draw();
}
</script></body></html>
