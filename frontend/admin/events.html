<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage Events · E-Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"></head>
<body data-root="../" data-role="admin" data-page="events"><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/store.js"></script><script src="../js/app.js"></script>
<script>
const v = App.shell('admin', 'events'); if (v) {
  const $ = id => document.getElementById(id);
  v.innerHTML = `<div class="page-head"><h1>Manage events</h1><button class="btn btn-brand" id="newBtn"><i class="bi bi-plus-lg me-1"></i>Create event</button></div>
    <div class="card p-3"><div class="table-wrap"><table class="table align-middle mb-0"><thead><tr><th>Event</th><th>Date &amp; time</th><th>Venue</th><th>Ticket types</th><th>Reserved</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
    <div class="modal fade" id="evModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="evForm" novalidate>
      <div class="modal-header"><h2 class="modal-title h5" id="evTitle"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><div id="evErr" class="alert alert-danger d-none"></div><div class="row g-3">
        <div class="col-md-8"><label class="form-label" for="f_name">Event name</label><input id="f_name" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label" for="f_cat">Category</label><input id="f_cat" class="form-control" list="cats" required><datalist id="cats"><option>Seminar<option>Concert<option>Workshop<option>Sports<option>Conference</datalist></div>
        <div class="col-md-4"><label class="form-label" for="f_date">Date</label><input id="f_date" type="date" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label" for="f_time">Start time</label><input id="f_time" type="time" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label" for="f_venue">Venue</label><input id="f_venue" class="form-control" required></div>
        <div class="col-12"><label class="form-label" for="f_desc">Description</label><textarea id="f_desc" rows="3" class="form-control"></textarea></div>
        <div class="col-12"><div class="d-flex justify-content-between align-items-center mb-2"><h3 class="h6 mb-0">Ticket types, price &amp; capacity</h3><button type="button" class="btn btn-sm btn-outline-primary" id="addType"><i class="bi bi-plus"></i> Add type</button></div>
          <div id="types" class="d-grid gap-2"></div><div class="form-text">Use a price of 0 for a free event. Capacity cannot be lower than tickets already reserved.</div></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand">Save event</button></div></form></div></div>`;
  const modal = new bootstrap.Modal($('evModal'));
  const typeRow = (t = {}) => `<div class="attendee-row type-row" data-id="${t.ticket_ID || ''}"><div class="row g-2 align-items-end">
    <div class="col-md-5"><label class="form-label small mb-1">Type name</label><input class="form-control tn" value="${App.esc(t.type_name || '')}" placeholder="e.g. Regular"></div>
    <div class="col-6 col-md-3"><label class="form-label small mb-1">Price (₱)</label><input class="form-control tp" type="number" min="0" step="0.01" value="${t.price ?? 0}"></div>
    <div class="col-6 col-md-3"><label class="form-label small mb-1">Capacity</label><input class="form-control tc" type="number" min="1" value="${t.ticket_ID ? t.quantity_available + t.quantity_sold : (t.total || 50)}"></div>
    <div class="col-md-1 text-end"><button type="button" class="btn btn-outline-danger rm" aria-label="Remove ticket type"><i class="bi bi-trash"></i></button></div></div>${t.quantity_sold ? `<div class="small text-muted-2 mt-1">${t.quantity_sold} already reserved</div>` : ''}</div>`;
  const bindRm = () => document.querySelectorAll('.rm').forEach(b => b.onclick = () => b.closest('.type-row').remove());
  let editing = null;
  const openForm = id => {
    editing = id ? Store.eventById(id) : null; const e = editing || { event_name: '', category: '', event_date: '', event_time: '', venue: '', description: '' };
    $('evTitle').textContent = editing ? 'Edit event' : 'Create event'; $('evErr').classList.add('d-none');
    $('f_name').value = e.event_name; $('f_cat').value = e.category; $('f_date').value = e.event_date; $('f_time').value = e.event_time; $('f_venue').value = e.venue; $('f_desc').value = e.description;
    $('types').innerHTML = (editing ? Store.typesOf(id) : [{ type_name: 'Regular', price: 0, total: 50 }]).map(typeRow).join(''); bindRm(); modal.show();
  };
  $('addType').onclick = () => { $('types').insertAdjacentHTML('beforeend', typeRow()); bindRm(); };
  $('newBtn').onclick = () => openForm();
  $('evForm').onsubmit = ev => {
    ev.preventDefault();
    try {
      const types = [...document.querySelectorAll('.type-row')].map(r => ({ ticket_ID: r.dataset.id ? +r.dataset.id : null, type_name: r.querySelector('.tn').value, price: +r.querySelector('.tp').value, total: +r.querySelector('.tc').value }));
      Store.saveEvent({ event_ID: editing?.event_ID, event_name: $('f_name').value, category: $('f_cat').value.trim() || 'General', event_date: $('f_date').value, event_time: $('f_time').value, venue: $('f_venue').value, description: $('f_desc').value }, types, App.user().user_ID);
      modal.hide(); draw(); App.toast(editing ? 'Event updated.' : 'Event created.');
    } catch (e) { $('evErr').textContent = e.message; $('evErr').classList.remove('d-none'); }
  };
  const draw = () => {
    $('rows').innerHTML = Store.events().map(e => { const s = Store.seats(e.event_ID), ts = Store.typesOf(e.event_ID); return `<tr><td><div class="fw-semibold">${App.esc(e.event_name)}</div><span class="badge text-bg-light">${App.esc(e.category)}</span></td><td>${App.fmtDate(e.event_date)}<div class="small text-muted-2">${App.fmtTime(e.event_time)}</div></td><td>${App.esc(e.venue)}</td>
      <td class="small">${ts.map(t => `${App.esc(t.type_name)} · ${App.peso(t.price)} · ${t.quantity_available} left`).join('<br>')}</td><td>${s.sold}/${s.total}</td>
      <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-secondary" data-edit="${e.event_ID}">Edit</button> <button class="btn btn-sm btn-outline-danger" data-del="${e.event_ID}" aria-label="Delete ${App.esc(e.event_name)}"><i class="bi bi-trash"></i></button></td></tr>`; }).join('');
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm(+b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Delete this event and its ticket types?')) { try { Store.deleteEvent(+b.dataset.del); draw(); App.toast('Event deleted.', 'secondary'); } catch (e) { App.toast(e.message, 'danger'); } } });
  };
  draw();
  if (App.param('new')) openForm(); else if (App.param('edit')) openForm(+App.param('edit'));
}
</script></body></html>
